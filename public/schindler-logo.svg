<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <radialGradient id="metalDisc" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E4E4E6"/>
      <stop offset="55%" stop-color="#C5C6C9"/>
      <stop offset="85%" stop-color="#8E9094"/>
      <stop offset="100%" stop-color="#6F7176"/>
    </radialGradient>
    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9E9FA4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4E5055" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="innerHole" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4A4B4F"/>
      <stop offset="40%" stop-color="#7C7E83"/>
      <stop offset="100%" stop-color="#D0D1D4"/>
    </linearGradient>
    <linearGradient id="coneShade" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#55565B"/>
      <stop offset="50%" stop-color="#85878C"/>
      <stop offset="100%" stop-color="#3A3B3E"/>
    </linearGradient>
  </defs>

  <!-- Metallic Disc with hole -->
  <g transform="translate(200, 80)">
    <!-- Outer Shadow / Border -->
    <circle cx="0" cy="0" r="62" fill="#5A5B60" opacity="0.3"/>
    <circle cx="0" cy="0" r="60" fill="url(#metalDisc)" stroke="#7A7C80" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="59.5" fill="none" stroke="url(#metalBevel)" stroke-width="1.2"/>

    <!-- Inner Circle Cutout Background -->
    <circle cx="0" cy="-6" r="28" fill="#FFFFFF"/>
    <circle cx="0" cy="-6" r="28" fill="none" stroke="url(#innerHole)" stroke-width="1.5"/>

    <!-- Triangular Peak / Cone -->
    <path d="M 0 -10 L 32 50 L -32 50 Z" fill="url(#coneShade)" stroke="#4E5055" stroke-width="0.8"/>
    <!-- Cone Highlight Line -->
    <line x1="0" y1="-10" x2="0" y2="50" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Red Schindler Wordmark -->
  <text x="200" y="200" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="-1.2px" 
        fill="#E20613">Schindler</text>
</svg>
